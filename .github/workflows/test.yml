name: test

on:
  pull_request:
  workflow_dispatch:
    inputs:
      openclaw_artifact_url:
        description: "Exact verified npm tarball, official OpenClaw release .tgz or Actions artifact URL"
        required: false
        type: string
      openclaw_artifact_sha256:
        description: "Must equal the approved OpenClaw 2026.9.2 SDK SHA-256"
        required: false
        type: string

permissions:
  contents: read

jobs:
  package-acceptance:
    name: required Linux fixtures (node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ["22.23.1", "24.15.0"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Generated package and release fixture tests (no SDK or accounts)
        run: node scripts/release-ci.mjs fixtures
      - name: Upload allowlisted fixture summary only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-fixtures-node-${{ matrix.node }}
          path: artifacts/release-evidence/fixture-results.json
          if-no-files-found: error
          retention-days: 14

  package-windows-experimental:
    name: experimental Windows fixtures (node ${{ matrix.node }})
    runs-on: windows-2022
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        node: ["22.23.1", "24.15.0"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Generated package and release fixture tests (experimental)
        run: node scripts/release-ci.mjs fixtures
      - name: Upload allowlisted fixture summary only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-experimental-fixtures-node-${{ matrix.node }}
          path: artifacts/release-evidence/fixture-results.json
          if-no-files-found: warn
          retention-days: 14

  full-sdk-acceptance:
    name: required Linux SDK acceptance (node ${{ matrix.node }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ["22.23.1", "24.15.0"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Download approved SDK (private bytes are never uploaded)
        env:
          SDK_URL: ${{ inputs.openclaw_artifact_url || vars.OPENCLAW_SDK_ARTIFACT_URL || 'https://registry.npmjs.org/openclaw/-/openclaw-2026.9.2.tgz' }}
          SDK_SHA256: ${{ inputs.openclaw_artifact_sha256 || vars.OPENCLAW_SDK_ARTIFACT_SHA256 || '3431f4cd2d8dbd6b936def2694ac27e19fa0256295cf4ada0f652ecf1c9ee520' }}
          SDK_TOKEN: ${{ secrets.OPENCLAW_ARTIFACT_TOKEN }}
        run: node scripts/release-sdk.mjs
      - name: Pinned SDK tests and freshly packed clean-source manifest
        env:
          DSH_RUN_ISOLATED_SDK_TRANSPORT: "1"
          DSH_CI_PRIVATE_ROOT: ${{ github.workspace }}/artifacts/release-private/linux-node-${{ matrix.node }}
          DSH_CAMPAIGN_TEST_ROOT: ${{ github.workspace }}/artifacts/release-private/linux-node-${{ matrix.node }}/campaign-tests
        run: node scripts/release-ci.mjs full
      - name: Upload allowlisted nonsecret evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-sdk-evidence-node-${{ matrix.node }}
          path: |
            artifacts/release-evidence/full-sdk-results.json
            artifacts/release-evidence/test-coverage.json
            artifacts/release-evidence/release-manifest.json
            artifacts/release-evidence/verification.json
            artifacts/release-evidence/reproducibility.json
            artifacts/release-evidence/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 14

  full-sdk-windows-experimental:
    name: experimental Windows SDK acceptance (node ${{ matrix.node }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        node: ["22.23.1", "24.15.0"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Download approved SDK (private bytes are never uploaded)
        env:
          SDK_URL: ${{ inputs.openclaw_artifact_url || vars.OPENCLAW_SDK_ARTIFACT_URL || 'https://registry.npmjs.org/openclaw/-/openclaw-2026.9.2.tgz' }}
          SDK_SHA256: ${{ inputs.openclaw_artifact_sha256 || vars.OPENCLAW_SDK_ARTIFACT_SHA256 || '3431f4cd2d8dbd6b936def2694ac27e19fa0256295cf4ada0f652ecf1c9ee520' }}
          SDK_TOKEN: ${{ secrets.OPENCLAW_ARTIFACT_TOKEN }}
        run: node scripts/release-sdk.mjs
      - name: Pinned SDK tests and freshly packed clean-source manifest (experimental)
        run: node scripts/release-ci.mjs full
      - name: Upload allowlisted nonsecret evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-experimental-sdk-evidence-node-${{ matrix.node }}
          path: |
            artifacts/release-evidence/full-sdk-results.json
            artifacts/release-evidence/release-manifest.json
            artifacts/release-evidence/verification.json
            artifacts/release-evidence/reproducibility.json
            artifacts/release-evidence/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 14

  required-linux-gate:
    name: required Linux aggregate (fixtures-only on PR)
    needs: [package-acceptance, full-sdk-acceptance]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.1"
      - name: Require all expected Linux matrix jobs (never certify skipped SDK tests)
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_FIXTURE_RESULT: ${{ needs.package-acceptance.result }}
          CI_SDK_RESULT: ${{ needs.full-sdk-acceptance.result }}
        run: node scripts/release-ci.mjs gate
      - name: Upload aggregate scope and decision only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: required-linux-gate
          path: artifacts/release-evidence/linux-gate.json
          if-no-files-found: error
          retention-days: 14
